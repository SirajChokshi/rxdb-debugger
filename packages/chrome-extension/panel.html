<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>RxDB Debugger</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        min-height: 100vh;
        background: var(--theme-bg, #0f0f14);
        color: var(--theme-text, #e4e4ef);
      }
      body.theme-light {
        --theme-bg: #ffffff;
        --theme-text: #1f2328;
      }
      body.theme-dark {
        --theme-bg: #0f0f14;
        --theme-text: #e4e4ef;
      }
      #root {
        width: 100%;
        height: 100vh;
      }
    </style>
    <script>
      // Detect DevTools theme and apply appropriate class
      (function() {
        try {
          var themeName = chrome.devtools && chrome.devtools.panels && chrome.devtools.panels.themeName;
          document.body.classList.add(themeName === 'dark' ? 'theme-dark' : 'theme-light');
        } catch (e) {
          // Fallback for environments without chrome.devtools
          document.body.classList.add('theme-dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="panel.js"></script>
  </body>
</html>
